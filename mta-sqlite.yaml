# Integration Pilot — Cloud Foundry deployment, SQLite variant (no HANA needed; demo only).
# The database is in-memory SQLite: chats, proposals and the audit log are lost on every
# restart/restage. The default mta.yaml uses HANA Cloud and keeps the data.
# Build: npm run build:mta:sqlite (mbt build -f mta-sqlite.yaml).
# Keep this file and mta.yaml in sync; they differ only in the database parts (marked "DB:").
_schema-version: '3.1'
ID: integration-pilot
version: 1.0.0
description: Integration Pilot — AI assistant & dashboard for SAP Cloud Integration

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npm ci --prefix app/integration-pilot
        - npm run build --prefix app/integration-pilot
        - node scripts/copy-ui-build.js
        - npx cds build --production

modules:
  # CAP backend (REST API /api, agent, iFlow builder)
  - name: integration-pilot-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      # ship sources only; the Node.js buildpack installs production dependencies from
      # package-lock.json at staging (keeps node_modules/.bin links intact, smaller mtar)
      builder: custom
      commands: []
    properties:
      CDS_ENV: sqlite # DB: in-memory SQLite, schema deployed at startup (see server.js)
      LLM_MODEL: nvidia/nemotron-3.5-super-vl-120b-a12b
      LLM_FALLBACK_MODEL: z-ai/glm-5.3
      LLM_TIMEOUT_MS: 900000 # cap for one streamed model call
      LLM_IDLE_TIMEOUT_MS: 60000 # longest pause in a streamed answer
      LLM_MAX_TOKENS: 16000
      AGENT_MAX_MODEL_CALLS: 20 # model calls per chat message
      AGENT_MAX_TOKENS_PER_MESSAGE: 300000 # token budget per chat message
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: integration-pilot-auth
      - name: iflowpilot-dest
      - name: groovy-check-api
        properties:
          GROOVY_CHECK_URL: ~{url}
          GROOVY_CHECK_TOKEN: ~{token}
          GROOVY_CHECK_REQUIRED: true

  # Groovy syntax check (parse-only, groovy-check/): validateSpec checks every script before a proposal
  - name: integration-pilot-groovy-check
    type: java
    path: groovy-check
    parameters:
      buildpack: java_buildpack
      memory: 256M
      disk-quota: 512M
      check-token: ${generated-password} # one value per deploy, shared with the srv module via groovy-check-api
      health-check-type: http
      health-check-http-endpoint: /health
    build-parameters:
      builder: maven
      build-result: target/groovy-check.jar
    properties:
      CHECK_TOKEN: ${check-token}
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+ } }'
    provides:
      - name: groovy-check-api
        properties:
          url: ${default-url}
          token: ${check-token}

  # Standalone approuter: XSUAA login, serves the SAPUI5 app build, forwards /api
  - name: integration-pilot
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    build-parameters:
      builder: npm-ci
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
          timeout: 180000 # AI explain/approve calls can take longer than the default 30s
      - name: integration-pilot-auth

resources:
  - name: integration-pilot-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: integration-pilot-${org}-${space}
        tenant-mode: dedicated

  # Existing destination service instance; subaccount destinations CPI_API and NVIDIA_LLM
  - name: iflowpilot-dest
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: iflowpilot-dest
